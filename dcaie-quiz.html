  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      color: #e6edf3;
      min-height: 100vh;

      align-items: center;

    }

    header {
      width: 100%;

      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      font-size: 0.9rem;
      color: #8b949e;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      background: #1f6feb33;
      border: 1px solid #1f6feb;
      color: #58a6ff;

      padding: 4px 14px;

      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      width: 100%;
      max-width: 860px;
      margin-bottom: 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      background: #21262d;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1f6feb, #58a6ff);
      border-radius: 8px;

    /* ── Card ── */
    .card {
      width: 100%;

      background: #161b22;
      border: 1px solid #30363d;

    .domain-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      color: #e6edf3;
      margin-bottom: 24px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      cursor: pointer;
      text-align: left;
      color: #e6edf3;
      font-size: 0.93rem;
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #58a6ff;
      background: #1f6feb1a;
    }

    .option-btn .key {
      min-width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #21262d;
      border: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #8b949e;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-btn.correct {
      border-color: #3fb950;
      background: #3fb95015;
    }

    .option-btn.correct .key {
      background: #3fb950;
      border-color: #3fb950;
      color: #fff;
    }

    .option-btn.wrong {
      border-color: #f85149;
      background: #f8514915;
    }

    .option-btn.wrong .key {
      background: #f85149;
      border-color: #f85149;
      color: #fff;
    }

    .option-btn.reveal {
      border-color: #3fb950;
      background: #3fb95015;
      opacity: 0.75;
    }

    .option-btn:disabled { cursor: default; }

    /* ── Explanation box ── */
    .explanation {
      margin-top: 18px;
      background: #1c2128;
      border-left: 3px solid #58a6ff;
      border-radius: 6px;
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #c9d1d9;
      display: none;
    }

    .explanation.show { display: block; }
    .explanation strong { color: #58a6ff; }

    .ref-links {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #30363d;
      font-size: 0.8rem;
      color: #8b949e;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 4px;
      align-items: center;
    }

    .ref-links .ref-label {
      font-weight: 700;
      color: #8b949e;
      margin-right: 2px;
    }

    .ref-links a {
      color: #58a6ff;
      text-decoration: none;
      background: #1f6feb1a;
      border: 1px solid #1f6feb44;
      border-radius: 4px;
      padding: 2px 8px;
      transition: background 0.12s;
    }

    .ref-links a:hover { background: #1f6feb33; text-decoration: underline; }

    /* ── Controls ── */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      gap: 12px;
      flex-wrap: wrap;

    .btn {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:disabled { opacity: 0.35; cursor: default; }

    .btn-primary {
      background: #238636;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { background: #2ea043; }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover:not(:disabled) { background: #30363d; }

    .btn-danger {
      background: #da3633;
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) { background: #f85149; }

    .score-live {
      font-size: 0.85rem;
      color: #8b949e;
    }

    .score-live span { color: #3fb950; font-weight: 700; }

    /* ── Result screen ── */
    #result-screen {
      width: 100%;
      max-width: 860px;
      display: none;
    }

    .result-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      text-align: center;
    }

    .result-card h2 {
      font-size: 1.5rem;
      color: #e6edf3;
      margin-bottom: 8px;
    }

    .result-score {
      font-size: 4rem;
      font-weight: 800;
      margin: 20px 0 4px;
    }

    .result-score.pass { color: #3fb950; }
    .result-score.fail { color: #f85149; }

    .result-label {
      font-size: 1rem;
      color: #8b949e;
      margin-bottom: 24px;
    }

    .result-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 28px 0;
    }

    .breakdown-item {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
    }

    .breakdown-item .bi-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .breakdown-item .bi-val {
      font-size: 1.4rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .review-list {
      margin-top: 28px;
      text-align: left;
    }

    .review-list h3 {
      font-size: 0.9rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .review-item {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 10px;
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .review-item .ri-q { color: #c9d1d9; margin-bottom: 6px; }
    .review-item .ri-yours { color: #f85149; }
    .review-item .ri-correct { color: #3fb950; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .card { padding: 22px 18px; }
      header h1 { font-size: 1.35rem; }
    }
  </style>
</head>

<script>
const questions = [
  // ── Domain 1: AI/ML Infrastructure Design ──────────────────────────────
  {
    domain: "AI/ML Infrastructure Design",
    q: "Which GPU interconnect technology enables direct GPU-to-GPU communication within a single server node, bypassing the CPU and PCIe bus for higher bandwidth?",
    options: ["PCIe Gen 5", "NVLink / NVSwitch", "RoCEv2", "InfiniBand HDR"],
    answer: 1,
    explain: "NVLink and NVSwitch provide high-bandwidth, low-latency GPU-to-GPU communication within a node. NVSwitch acts as a full mesh interconnect between GPUs, eliminating CPU bottlenecks.",
    refs: [
      { text: "NVIDIA NVLink Overview", url: "https://www.nvidia.com/en-us/data-center/nvlink/" },
      { text: "NVIDIA NVSwitch", url: "https://www.nvidia.com/en-us/data-center/nvswitch/" }
    ]
  },
  {
    domain: "AI/ML Infrastructure Design",
    q: "What is the primary advantage of GPUDirect RDMA in an AI training cluster?",
    options: [
      "It allows GPUs to share CPU memory directly",
      "It enables GPU memory to communicate with network adapters without involving the host CPU",
      "It increases the PCIe lane count available to each GPU",
      "It provides a software-defined storage interface for GPU workloads"
    ],
    answer: 1,
    explain: "GPUDirect RDMA allows the NIC to move data directly to/from GPU memory, bypassing the CPU and system RAM. This dramatically reduces latency and CPU overhead for distributed AI training.",
    refs: [
      { text: "NVIDIA GPUDirect RDMA", url: "https://docs.nvidia.com/cuda/gpudirect-rdma/" },
      { text: "NVIDIA Developer Blog: GPUDirect", url: "https://developer.nvidia.com/gpudirect" }
    ]
  },
  {
    domain: "AI/ML Infrastructure Design",
    q: "Which Cisco UCS server line is purpose-built to support dense GPU configurations for AI/ML training workloads?",
    options: ["Cisco UCS C220 M7", "Cisco UCS C480 ML M5", "Cisco UCS B200 M6", "Cisco UCS S3260"],
    answer: 1,
    explain: "The Cisco UCS C480 ML M5 is purpose-built for machine learning, supporting up to eight NVIDIA Tesla GPUs and optimized PCIe topology for AI/ML training workloads.",
    refs: [
      { text: "Cisco UCS C480 ML M5 Data Sheet", url: "https://www.cisco.com/c/en/us/products/servers-unified-computing/ucs-c480-ml-m5-rack-server/index.html" },
      { text: "Cisco UCS for AI/ML", url: "https://www.cisco.com/c/en/us/solutions/data-center-virtualization/ai-ml/index.html" }
    ]
  },
  {
    domain: "AI/ML Infrastructure Design",
    q: "NVIDIA Multi-Instance GPU (MIG) technology is BEST suited for which type of workload scenario in a data center?",
    options: [
      "Large-scale distributed training requiring full GPU memory",
      "Multiple smaller inference workloads that share a single GPU with isolation",
      "CPU-offload tasks during storage I/O operations",
      "Fabric management of spine-leaf switching"
    ],
    answer: 1,
    explain: "MIG partitions a single GPU into multiple isolated instances, each with dedicated compute, memory, and cache resources. This is ideal for inference services running multiple smaller models concurrently.",
    refs: [
      { text: "NVIDIA MIG User Guide", url: "https://docs.nvidia.com/datacenter/tesla/mig-user-guide/" },
      { text: "NVIDIA MIG Overview", url: "https://www.nvidia.com/en-us/technologies/multi-instance-gpu/" }
    ]
  },
  {
    domain: "AI/ML Infrastructure Design",
    q: "What does the term 'fat-tree topology' refer to in the context of AI/ML cluster networking?",
    options: [
      "A topology with oversubscribed access-layer switches",
      "A multi-path hierarchical network where uplinks have equal or greater bandwidth than downlinks, providing non-blocking connectivity",
      "A single-tier flat Layer 2 network for east-west GPU traffic",
      "A storage network architecture using NVMe-oF over TCP"
    ],
    answer: 1,
    explain: "Fat-tree (Clos network) provides non-blocking bandwidth by ensuring uplink capacity equals or exceeds downlink capacity at every tier. It is the standard topology for HPC and AI training fabrics.",
    refs: [
      { text: "RFC 7938: BGP in DC Networks (Clos context)", url: "https://datatracker.ietf.org/doc/html/rfc7938" },
      { text: "NVIDIA Ethernet for AI Networking", url: "https://www.nvidia.com/en-us/networking/ethernet-for-ai/" }
    ]
  },

  // ── Domain 2: Network Infrastructure ────────────────────────────────────
  {
    domain: "Network Infrastructure for AI/ML",
    q: "Which technology enables RDMA (Remote Direct Memory Access) to operate over standard Ethernet networks in AI/ML data center fabrics?",
    options: ["FCoE", "RoCEv2 (RDMA over Converged Ethernet v2)", "iSCSI", "VXLAN with BUM flooding"],
    answer: 1,
    explain: "RoCEv2 encapsulates RDMA traffic in UDP/IP packets, enabling RDMA to run on standard Ethernet. It requires a lossless fabric (PFC + ECN) for optimal performance.",
    refs: [
      { text: "NVIDIA RoCE Overview", url: "https://www.nvidia.com/en-us/networking/ethernet-for-ai/" },
      { text: "Cisco Nexus 9000 RoCE Config", url: "https://www.cisco.com/c/en/us/products/switches/nexus-9000-series-switches/index.html" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "What is the purpose of Priority Flow Control (PFC) in a RoCEv2-enabled AI fabric?",
    options: [
      "To encrypt traffic between GPU nodes",
      "To prevent packet loss by pausing specific traffic classes at the Ethernet layer",
      "To load-balance traffic across ECMP paths",
      "To advertise reachability of GPU nodes via BGP"
    ],
    answer: 1,
    explain: "PFC (IEEE 802.1Qbb) pauses specific Ethernet priority queues to prevent packet drops. RDMA is extremely sensitive to packet loss; PFC creates a lossless fabric required by RoCEv2.",
    refs: [
      { text: "IEEE 802.1Qbb (PFC) Standard", url: "https://standards.ieee.org/ieee/802.1Qbb/4089/" },
      { text: "Cisco NX-OS QoS Config Guide", url: "https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/qos/b-cisco-nexus-9000-series-nx-os-quality-of-service-configuration-guide-93x.html" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "Explicit Congestion Notification (ECN) in combination with PFC in an AI fabric is used to:",
    options: [
      "Encrypt inter-GPU traffic end-to-end",
      "Signal congestion to endpoints before buffers fill up, allowing them to slow transmission rate proactively",
      "Replace spanning tree in a Layer 2 fabric",
      "Assign VLAN tags to storage traffic"
    ],
    answer: 1,
    explain: "ECN marks packets when switch buffers begin to fill, notifying senders to reduce their rate before drops occur. Used with PFC, this implements DCQCN (Data Center Quantized Congestion Notification) for RoCEv2.",
    refs: [
      { text: "RFC 3168: ECN for IP", url: "https://datatracker.ietf.org/doc/html/rfc3168" },
      { text: "Cisco ECN Configuration", url: "https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/qos/b-cisco-nexus-9000-series-nx-os-quality-of-service-configuration-guide-93x.html" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "What is DCQCN (Data Center Quantized Congestion Notification)?",
    options: [
      "A Cisco proprietary VLAN-tagging protocol for GPU traffic",
      "A congestion control algorithm combining ECN with a rate-based control loop, designed for RoCEv2 lossless fabrics",
      "A storage protocol for NVMe over Fabrics",
      "An NVIDIA driver module for NVLink acceleration"
    ],
    answer: 1,
    explain: "DCQCN is the standard congestion control algorithm for RoCEv2. It uses ECN signals from switches and DCQCN logic in the NIC/RNIC to rate-limit senders, preventing PFC storms while maintaining throughput.",
    refs: [
      { text: "DCQCN Paper (SIGCOMM 2015)", url: "https://dl.acm.org/doi/10.1145/2785956.2787484" },
      { text: "NVIDIA RoCEv2 Congestion Control", url: "https://www.nvidia.com/en-us/networking/ethernet-for-ai/" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "In a spine-leaf AI fabric, which Cisco Nexus switch series is specifically designed for ultra-low latency and high-radix connectivity in AI/ML training clusters?",
    options: ["Cisco Nexus 5000", "Cisco Nexus 9000 (e.g., N9K-C9336C-FX2)", "Cisco Nexus 7000", "Cisco Nexus 3000"],
    answer: 1,
    explain: "The Cisco Nexus 9000 series (e.g., 9336C-FX2, 9364C) is widely used in AI/ML fabrics due to its high port density, low latency, programmable ASIC (Cisco Cloud Scale ASIC), and RoCEv2/PFC/ECN support.",
    refs: [
      { text: "Cisco Nexus 9000 Series", url: "https://www.cisco.com/c/en/us/products/switches/nexus-9000-series-switches/index.html" },
      { text: "Cisco Nexus 9000 Data Sheet", url: "https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/datasheet-c78-736207.html" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "What is the key reason to minimize oversubscription ratios (targeting 1:1) in an AI training fabric compared to a typical enterprise network?",
    options: [
      "AI workloads require multicast forwarding that oversubscription disables",
      "During collective communication operations (AllReduce, AllGather), all GPUs communicate simultaneously, producing all-to-all traffic that saturates oversubscribed links",
      "Oversubscription causes VLAN misconfiguration in large clusters",
      "Cisco Nexus switches require 1:1 ratios for BGP convergence"
    ],
    answer: 1,
    explain: "AI collective operations like AllReduce cause all GPU nodes to communicate at once. Even mild oversubscription creates bottlenecks that significantly slow training. A non-blocking (1:1) fabric is the standard design target.",
    refs: [
      { text: "NVIDIA Collective Communication (NCCL)", url: "https://docs.nvidia.com/deeplearning/nccl/user-guide/docs/overview.html" },
      { text: "NVIDIA Ethernet for AI", url: "https://www.nvidia.com/en-us/networking/ethernet-for-ai/" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "Which routing protocol is recommended for large-scale spine-leaf AI fabrics to provide scalable, loop-free Layer 3 routing with fast convergence?",
    options: ["OSPF with stub areas", "EIGRP", "BGP (BGP Unnumbered or eBGP between tiers)", "STP with RSTP fallback"],
    answer: 2,
    explain: "BGP (often unnumbered eBGP) is the preferred routing protocol for large data center fabrics. It provides scalable policy control, supports ECMP, and is widely used in both Cisco ACI and NX-OS-based AI fabrics.",
    refs: [
      { text: "RFC 7938: Use of BGP for DC Networks", url: "https://datatracker.ietf.org/doc/html/rfc7938" },
      { text: "Cisco NX-OS BGP Config Guide", url: "https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/sw/93x/unicast/configuration/guide/b-cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide-93x/b-cisco-nexus-9000-series-nx-os-unicast-routing-configuration-guide-93x_chapter_01011.html" }

    q: "In the context of AI networking, what does 'rail-optimized' or 'rail-based' topology mean?",

    answer: 0,
    explain: "A rail-optimized topology connects each GPU NIC in a server to a separate leaf switch (one NIC per 'rail'). This ensures traffic from different jobs stays within designated rails and avoids cross-contamination.",
    refs: [
      { text: "NVIDIA DGX SuperPOD Network Design", url: "https://docs.nvidia.com/dgx-superpod/reference-architecture-scalable-infrastructure-h100/latest/" },
      { text: "NVIDIA Ethernet for AI Reference", url: "https://www.nvidia.com/en-us/networking/ethernet-for-ai/" }
    ]
  },
  {
    domain: "Network Infrastructure for AI/ML",
    q: "VXLAN EVPN is used in AI data center fabrics primarily to provide:",
    options: [
      "GPU clock synchronization",
      "Overlay-based multi-tenancy and workload mobility with a BGP EVPN control plane for MAC/IP distribution",
      "Direct InfiniBand-to-Ethernet translation",
      "PFC pause frame generation for RoCEv2"

    answer: 1,
    explain: "VXLAN with EVPN control plane enables scalable Layer 2/3 overlays across the fabric, supporting multi-tenancy, workload mobility, and distributed anycast gateway — common in Cisco ACI and NX-OS fabrics.",
    refs: [
      { text: "RFC 8365: VXLAN EVPN", url: "https://datatracker.ietf.org/doc/html/rfc8365" },

    options: [

// ── State ────────────────────────────────────────────────────────────────
let current   = 0;
let answered  = new Array(questions.length).fill(null);
let correct   = 0;
let incorrect = 0;

// ── Render ───────────────────────────────────────────────────────────────
function render() {
  const q   = questions[current];
  const ans = answered[current];
  const total = questions.length;

  // progress
  const done = answered.filter(a => a !== null).length;
  const pct  = Math.round((done / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('pct-label').textContent  = pct + '% answered';

  // live score
  document.getElementById('live-score').textContent = correct;
  document.getElementById('live-total').textContent = answered.filter(a => a !== null).length;

  // question
  document.getElementById('domain-tag').textContent = q.domain;
  document.getElementById('question-text').textContent = `${current + 1}. ${q.q}`;

  // options
  const keys = ['A', 'B', 'C', 'D'];
  const optWrap = document.getElementById('options');
  optWrap.innerHTML = '';

  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="key">${keys[i]}</span><span>${opt}</span>`;
    btn.disabled = (ans !== null);

    if (ans !== null) {
      if (i === q.answer)                              btn.classList.add('correct');
      else if (i === ans && i !== q.answer)            btn.classList.add('wrong');
    }

    btn.addEventListener('click', () => selectAnswer(i));
    optWrap.appendChild(btn);
  });

  // explanation + references
  const expEl = document.getElementById('explanation');
  if (ans !== null) {
    let refsHtml = '';
    if (q.refs && q.refs.length > 0) {
      const links = q.refs
        .map(r => `<a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.text}</a>`)
        .join('');
      refsHtml = `<div class="ref-links"><span class="ref-label">References:</span>${links}</div>`;
    }
    expEl.innerHTML = `<strong>Explanation:</strong> ${q.explain}${refsHtml}`;
    expEl.classList.add('show');
  } else {
    expEl.classList.remove('show');
    expEl.innerHTML = '';
  }

  // navigation
  document.getElementById('prev-btn').disabled = (current === 0);
  const isLast = (current === total - 1);

  if (isLast) {
    document.getElementById('next-btn').style.display   = 'none';
    document.getElementById('finish-btn').style.display = 'inline-flex';
    document.getElementById('finish-btn').disabled = false;
  } else {
    document.getElementById('next-btn').style.display   = '';
    document.getElementById('finish-btn').style.display = 'none';
    document.getElementById('next-btn').disabled = (ans === null);
  }
}

function selectAnswer(idx) {
  if (answered[current] !== null) return;
  answered[current] = idx;
  if (idx === questions[current].answer) correct++;
  else incorrect++;
  render();
}

function navigate(dir) {
  current = Math.max(0, Math.min(questions.length - 1, current + dir));
  render();
}

// ── Results ──────────────────────────────────────────────────────────────
function showResults() {
  document.getElementById('quiz-card').style.display     = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total   = questions.length;
  const skipped = answered.filter(a => a === null).length;
  const pct     = Math.round((correct / total) * 100);

  const pctEl = document.getElementById('result-pct');
  pctEl.textContent = pct + '%';
  pctEl.className   = 'result-score ' + (pct >= 83 ? 'pass' : 'fail');

  document.getElementById('result-label').textContent =
    pct >= 83 ? 'PASS — Great work!' : 'Not quite — keep studying!';

  document.getElementById('rb-correct').textContent = correct;
  document.getElementById('rb-wrong').textContent   = incorrect;
  document.getElementById('rb-skip').textContent    = skipped;

  // Missed questions review
  const missed = questions
    .map((q, i) => ({ q, i, choice: answered[i] }))
    .filter(({ q, choice }) => choice !== q.answer);

  const reviewEl = document.getElementById('missed-review');
  if (missed.length === 0) {
    reviewEl.innerHTML = '<h3 style="color:#3fb950;margin-top:20px;">Perfect score — no missed questions!</h3>';
    return;
  }

  const keys = ['A', 'B', 'C', 'D'];
  let html = `<h3>Missed Questions (${missed.length})</h3>`;
  missed.forEach(({ q, i, choice }) => {
    const yourAns = choice !== null
      ? `${keys[choice]}: ${q.options[choice]}`
      : 'Not answered';
    html += `
      <div class="review-item">
        <div class="ri-q"><strong>Q${i + 1}.</strong> ${q.q}</div>
        <div class="ri-yours">Your answer: ${yourAns}</div>
        <div class="ri-correct">Correct: ${keys[q.answer]}: ${q.options[q.answer]}</div>
      </div>`;
  });
  reviewEl.innerHTML = html;
}

function restartQuiz() {
  current   = 0;
  answered  = new Array(questions.length).fill(null);
  correct   = 0;
  incorrect = 0;
  document.getElementById('result-screen').style.display  = 'none';
  document.getElementById('quiz-card').style.display      = '';
  document.getElementById('progress-wrap').style.display  = '';
  render();
}

// ── Init ─────────────────────────────────────────────────────────────────
render();
</script>
